[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "template-specialize"
version = "1.6.2"
description = "Command-line tool for rendering Jinja2 templates"
readme = "README.md"
license = "MIT"
keywords = ["jinja2", "template", "render", "specialize"]
authors = [
    {name = "Craig A. Hobbs", email = "craigahobbs@gmail.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Text Processing :: General",
    "Topic :: Utilities"
]
dependencies = [
    "jinja2 >= 2.10"
]

[project.urls]
Homepage = "https://github.com/craigahobbs/template-specialize"

[project.scripts]
template-specialize = "template_specialize.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["template_specialize"]
